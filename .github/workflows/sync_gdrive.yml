name: Auto-Sync from Google Drive

on:
  schedule:
    # 每天东京时间 06:00, 12:00, 18:00, 24:00 (UTC 21:00, 03:00, 09:00, 15:00) 自动同步
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [gdrive_update]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Drive Sync Script
        run: |
          python3 scripts/sync_gdrive.py
      - name: Commit & Push if Changes Detected
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add content/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync updated documents from Google Drive [skip ci]" && git push)

# 注册触碰: 修复 GitHub 偶发的 workflow 未注册问题
