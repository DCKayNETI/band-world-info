name: Auto-Sync from Google Drive

on:
  schedule:
    # 每 30 分钟自动同步一次（UTC，约等于东京时间每 30 分钟）
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [gdrive_update]

permissions:
  contents: write

concurrency:
  group: gdrive-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Drive Sync Script
        run: |
          python3 scripts/sync_gdrive.py
      - name: Commit & Push if Changes Detected
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add content/
          if ! git diff --staged --quiet; then
            # 提交信息不得含 [skip ci]：否则会压制 deploy.yml 的 push 触发，网站不更新
            git commit -m "sync: auto-sync updated documents from Google Drive"
            git push
          fi

# 注册触碰: 修复 GitHub 偶发的 workflow 未注册问题
